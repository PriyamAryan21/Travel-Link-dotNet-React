<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 100" width="100%" height="100%">
  <defs>
    <linearGradient id="t-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="link-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cardo:wght@700&amp;family=Great+Vibes&amp;display=swap');
      .t-text {
        font-family: 'Cardo', serif;
        font-weight: 700;
        font-size: 60px;
        fill: url(#t-gradient);
      }
      .link-text {
        font-family: 'Great Vibes', cursive;
        font-size: 55px;
        fill: url(#link-gradient);
      }
    </style>
  </defs>
  <text x="5" y="70" class="t-text">T</text>
  <text x="45" y="70" class="link-text">Link</text>
</svg>